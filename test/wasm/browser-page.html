<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CNA-TS WebAssembly runtime harness</title>
</head>
<body>
<canvas id="canvas" width="320" height="240"></canvas>
<script type="module">
// This page is a real consumer of the built package: it imports the public XNA surface and never
// an internal path, and the game below is the ordinary XNA shape a Node consumer writes.
const result = { status: "running", frames: 0, errors: [] };
globalThis.__cnaHarness = result;
window.onerror = (message, source, line, column, error) => {
  result.errors.push(`error: ${error && error.stack ? error.stack : `${message} @${source}:${line}:${column}`}`);
  return false;
};
window.addEventListener("unhandledrejection", (event) => result.errors.push(
  `rejection: ${event.reason && event.reason.stack ? event.reason.stack : String(event.reason)}`,
));

try {
  const {
    Audio, Color, Content, Game, GraphicsDeviceManager, Graphics, GetRuntimeStatus, LoadWasmBackend,
    TitleContainer, TimeSpan, Vector2,
  } = await import("/cna-ts/index.js");
  const createCnaCApi = (await import("/wasm/cna_c_api.mjs")).default;
  const canvas = document.getElementById("canvas");

  // The module is instantiated here rather than through LoadWasmBackend's Factory option because a
  // browser game's assets have to reach the module's filesystem before CNA reads them. This is the
  // ordinary browser shape: fetch the bytes, write them where the runtime looks, then load them
  // through the same Content API a desktop consumer uses.
  const module = await createCnaCApi({ canvas });
  const fetchBytes = async (url) => new Uint8Array(await (await fetch(url)).arrayBuffer());
  module.FS.writeFile("/title-note.txt", await fetchBytes("/fixtures/title-note.txt"));
  module.FS.mkdir("/Content");
  module.FS.writeFile("/Content/Atlas.xnb", await fetchBytes("/fixtures/Atlas.xnb"));
  module.FS.writeFile("/Content/SyntheticFont.xnb", await fetchBytes("/fixtures/SyntheticFont.xnb"));

  const status = await LoadWasmBackend({ Module: module });
  result.backend = status.Backend;
  result.abiVersion = status.AbiVersion;
  result.importedSymbolCount = status.ImportedSymbolCount;

  // The modern CNA runtime services, over the same WebAssembly module. These reach routes that
  // take a CNA_StringView by value, which docs/c-api/WASM_ARTIFACT.md leaves unpinned for wasm32,
  // so exercising them here is what settles the convention with evidence.
  const ext = await import("/cna-ts/extensions/runtime/index.js");
  const platform = ext.GetPlatformInfo();
  result.extensions = {
    platform: platform.Platform,
    platformName: platform.Name,
    isMobile: platform.IsMobile,
    selected: ext.RendererSelection.GetState().Selected,
    available: ext.RendererSelection.GetAvailable().map((r) => r.Name),
    availableCategories: ext.RendererSelection.GetAvailable().map((r) => r.CategoryName),
    parsedWebGL2: ext.RendererSelection.TryParseName("webgl2"),
    parsedNonsense: ext.RendererSelection.TryParseName("not-a-renderer"),
    fallbacks: ext.RendererSelection.GetFallbacks().length,
    logLevel: ext.CnaLog.GetMinimumLevel(),
    graphicsExtensionLayer: ext.IsGraphicsExtensionLayerAvailable(),
  };
  ext.CnaLog.Write(ext.CnaLogLevel.Fatal, ext.CnaLogCategory.Test, "cna-ts wasm runtime services");

  const targetFrames = Number(new URLSearchParams(location.search).get("frames") ?? "60");

  class HelloGame extends Game {
    constructor() {
      super();
      this.graphics = new GraphicsDeviceManager(this);
      this.graphics.PreferredBackBufferWidth = 320;
      this.graphics.PreferredBackBufferHeight = 240;
      // A browser drives frames from requestAnimationFrame, so the frame clock is the
      // page's. A fixed timestep would make CNA wait out the remainder of each frame.
      this.IsFixedTimeStep = false;
      this.updates = 0;
      this.draws = 0;
      this.texture = null;
      this.font = null;
      this.spriteBatch = null;
    }

    Initialize() {
      super.Initialize();
    }

    LoadContent() {
      this.spriteBatch = new Graphics.SpriteBatch(this.GraphicsDevice);
      this.texture = new Graphics.Texture2D(this.GraphicsDevice, 2, 2);
      this.texture.SetData([Color.Red, Color.Green, Color.Blue, Color.White]);
      const info = this.texture.Width * 1000 + this.texture.Height;
      result.textureInfo = info;

      // Title storage, read out of the module filesystem through the ordinary XNA entry point.
      result.titleNote = new TextDecoder().decode(TitleContainer.OpenStream("title-note.txt"));
      try {
        TitleContainer.OpenStream("does-not-exist.txt");
        result.titleMissing = "opened";
      } catch (error) {
        result.titleMissing = String(error && error.message ? error.message : error);
      }

      // The raw asset, before any XNB parsing: proves the count/copy pair agrees with itself and
      // that the copy landed the file's real leading bytes rather than a zeroed buffer.
      const atlasBytes = TitleContainer.OpenStream("Content/Atlas.xnb");
      result.atlasProbe = { length: atlasBytes.length, head: [...atlasBytes.subarray(0, 12)] };

      // A real ContentManager over that same title storage: XNB framing, the reader table and the
      // Texture2D reader graph, all managed, ending in a native texture whose pixels are asserted.
      this.content = new Content.ContentManager(this.Services, "Content");
      this.atlas = this.content.Load(Graphics.Texture2D, "Atlas");
      const loaded = new Array(4);
      this.atlas.GetData(loaded);
      result.contentTexture = {
        width: this.atlas.Width,
        height: this.atlas.Height,
        format: this.atlas.Format,
        pixels: loaded.map((color) => color.PackedValue),
        cached: this.content.Load(Graphics.Texture2D, "Atlas") === this.atlas,
      };
      this.font = this.content.Load(Graphics.SpriteFont, "SyntheticFont");
      const measured = this.font.MeasureString("A?");
      result.contentFont = { width: measured.X, height: measured.Y, spacing: this.font.Spacing };

      // Off-screen rendering, and the first pixels this project asserts out of a real GPU: clear a
      // render target to an exact colour, restore the backbuffer, and read the target back.
      this.target = new Graphics.RenderTarget2D(this.GraphicsDevice, 4, 4);
      this.GraphicsDevice.SetRenderTarget(this.target);
      result.boundTarget = this.GraphicsDevice.GetRenderTargets().length;
      this.GraphicsDevice.Clear(new Color(12, 34, 56, 255));
      this.GraphicsDevice.SetRenderTarget(null);
      result.unboundTarget = this.GraphicsDevice.GetRenderTargets().length;
      const readback = new Array(16);
      this.target.GetData(readback);
      result.renderTarget = {
        width: this.target.Width,
        height: this.target.Height,
        depthFormat: this.target.DepthStencilFormat,
        usage: this.target.RenderTargetUsage,
        multiSampleCount: this.target.MultiSampleCount,
        isContentLost: this.target.IsContentLost,
        pixels: readback.map((color) => color.PackedValue),
      };
      try {
        this.GraphicsDevice.SetRenderTarget(this.target);
        this.target.Dispose();
        result.boundDisposal = "disposed";
      } catch (error) {
        result.boundDisposal = String(error && error.message ? error.message : error);
      } finally {
        this.GraphicsDevice.SetRenderTarget(null);
      }
      // Sound, which is most of what separates a demo from a game. A quarter second of 16-bit
      // mono PCM at 8 kHz: the duration is arithmetic on the sample count, so it is exact and does
      // not depend on anything being audible. Whether a browser actually plays it depends on the
      // page having had a user gesture, which a headless run does not have -- so what is asserted
      // is the state machine, not a sound nobody heard.
      const sampleRate = 8000;
      const frames = sampleRate / 4;
      // XNA's SoundEffect takes a byte[], and this projection keeps that signature exactly, so the
      // samples are written through a view and handed over as the byte array XNA declares.
      const samples = new DataView(new ArrayBuffer(frames * 2));
      for (let index = 0; index < frames; index += 1) {
        samples.setInt16(index * 2, Math.round(8000 * Math.sin(index * 0.05)), true);
      }
      const pcm = [...new Uint8Array(samples.buffer)];
      this.sound = new Audio.SoundEffect(pcm, sampleRate, Audio.AudioChannels.Mono);
      this.soundInstance = this.sound.CreateInstance();
      const played = this.sound.Play();
      this.soundInstance.Volume = 0.5;
      this.soundInstance.Pitch = 0.25;
      this.soundInstance.Pan = -0.75;
      this.soundInstance.IsLooped = true;
      const initialState = this.soundInstance.State;
      this.soundInstance.Play();
      const playingState = this.soundInstance.State;
      this.soundInstance.Pause();
      const pausedState = this.soundInstance.State;
      this.soundInstance.Resume();
      const resumedState = this.soundInstance.State;
      this.soundInstance.Stop();
      result.audio = {
        durationTicks: String(this.sound.Duration.Ticks),
        durationMilliseconds: this.sound.Duration.TotalMilliseconds,
        expectedMilliseconds: TimeSpan.FromTicks(
          BigInt(Math.round((frames / sampleRate) * 10_000_000)),
        ).TotalMilliseconds,
        played,
        volume: this.soundInstance.Volume,
        pitch: this.soundInstance.Pitch,
        pan: this.soundInstance.Pan,
        isLooped: this.soundInstance.IsLooped,
        states: [initialState, playingState, pausedState, resumedState, this.soundInstance.State],
        masterVolume: Audio.SoundEffect.MasterVolume,
      };

      super.LoadContent();
    }

    Update(gameTime) {
      this.updates += 1;
      super.Update(gameTime);
    }

    Draw(gameTime) {
      this.GraphicsDevice.Clear(Color.CornflowerBlue);
      this.spriteBatch.Begin();
      this.spriteBatch.Draw(this.texture, new Vector2(16, 16), Color.White);
      this.spriteBatch.DrawString(this.font, "A?", new Vector2(32, 32), Color.White);
      this.spriteBatch.End();
      this.draws += 1;
      super.Draw(gameTime);
    }

    UnloadContent() {
      this.soundInstance?.Dispose();
      this.soundInstance = null;
      this.sound?.Dispose();
      this.sound = null;
      this.target?.Dispose();
      this.target = null;
      this.content?.Dispose();
      this.content = null;
      this.texture?.Dispose();
      this.texture = null;
      this.spriteBatch?.Dispose();
      this.spriteBatch = null;
      super.UnloadContent();
    }
  }

  const game = new HelloGame();
  result.rendererName = null;

  await new Promise((resolve, reject) => {
    const pump = () => {
      try {
        game.RunOneFrame();
        result.frames += 1;
        if (result.rendererName == null && game.GraphicsDevice) {
          result.rendererName = GetRuntimeStatus().RendererInfo?.Name ?? "";
        }
        if (result.frames >= targetFrames) {
          resolve();
          return;
        }
        requestAnimationFrame(pump);
      } catch (error) {
        reject(error);
      }
    };
    requestAnimationFrame(pump);
  });

  result.isFixedTimeStep = game.IsFixedTimeStep;
  result.updates = game.updates;
  result.draws = game.draws;
  game.Exit();
  game.Dispose();
  result.disposed = game.IsDisposed !== false;
  result.status = "ok";
} catch (error) {
  result.status = "failed";
  result.error = String(error && error.stack ? error.stack : error);
  if (error && error.cause) {
    result.error += `\ncaused by: ${error.cause.stack ?? error.cause}`;
  }
}
</script>
</body>
</html>
