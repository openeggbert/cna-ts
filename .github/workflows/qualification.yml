name: Qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Locked dependency install
        run: npm ci
      - name: Clean build
        run: npm run build
      - name: Strict declaration type check
        run: node node_modules/typescript/bin/tsc -p tsconfig.types.json
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: Differential tests
        run: node test/differential-xna.test.mjs
      - name: Runtime-symbol verification
        run: |
          node tools/api-compat/verify-runtime.mjs --format json --output /tmp/runtime-symbol-report.json
          cmp docs/runtime-symbol-report.json /tmp/runtime-symbol-report.json
      - name: Internal/native leak guard
        run: |
          node tools/api-compat/verify.mjs --leak-only --format json --output /tmp/internal-leak-report.json
          cmp docs/internal-leak-report.json /tmp/internal-leak-report.json
      - name: Runtime capability inventory is current
        run: |
          node tools/runtime-capabilities/generate.mjs
          git diff --exit-code -- docs/runtime-capabilities.json docs/runtime-capabilities.md
      - name: Checkout the exact audited CNA headers
        uses: actions/checkout@v4
        with:
          repository: openeggbert/cna
          # The revision the checked-in ABI, contract and coverage reports were measured from. A
          # branch name here would make every report a moving target; a SHA makes a moved
          # dependency a deliberate update with new numbers rather than a silent drift.
          #
          # It had drifted anyway, in the direction the comment above did not anticipate: the
          # reports moved and the pin did not. `17b5a90a0` declares 4051 routes and the checked-in
          # report says 4054, so the `cmp` below could not have passed. Both now name
          # `89024e0d4`, which is the newest commit that exists on the remote -- CNA's own
          # `next` has ten further commits that are local to the development machine, and a SHA
          # this workflow cannot fetch is not a pin.
          ref: 89024e0d4eef43d197549dcc1378dd551a9fb973
          path: cna-headers
      - name: ABI declarations and all imported signatures
        run: |
          node tools/audit-cna-abi.mjs --cna-root cna-headers --portable --format json --output /tmp/cna-abi-report.json
          cmp docs/cna-abi-report.json /tmp/cna-abi-report.json
      - name: The C enum, scalar and result-code contract compiles against the headers
        run: |
          node tools/cna-abi/verify-contract.mjs --cna-root cna-headers --portable --format json --output /tmp/cna-abi-contract-report.json
          cmp docs/cna-abi-contract-report.json /tmp/cna-abi-contract-report.json
      - name: Every C API route stays classified and reachability stays current
        run: |
          node tools/cna-abi/coverage.mjs --cna-root cna-headers --output /tmp/cna-api-coverage.md --json-output /tmp/cna-api-coverage.json
          cmp docs/cna-api-coverage.md /tmp/cna-api-coverage.md
          cmp docs/cna-api-coverage.json /tmp/cna-api-coverage.json
      - name: The generated backend base and wasm layout are not stale
        run: |
          node tools/backend/generate-backend-base.mjs
          git diff --exit-code -- src/internal/backend-base.ts
      - name: Every wasm route call and structure field checks out against the headers
        # The route table matches the routes actually called, every call's arity and BigInt-ness
        # matches its C declaration, and every structure field named exists in the measured layout.
        # All three are static, so they catch what no scenario reaches: three structures once
        # shipped with fields the probe never measured, each throwing on first use.
        env:
          CNA_SOURCE_PATH: cna-headers
        run: npm run verify:wasm
      - name: Reproducible clean dist
        run: node tools/verify-build-reproducibility.mjs
      - name: npm pack
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
      - name: Exact packed TypeScript, JavaScript, and export consumers
        run: node tools/verify-package.mjs --package artifacts/cna-ts-0.1.0.tgz
      - name: Reproducible npm package
        run: node tools/verify-package-reproducibility.mjs
      - name: Checkout canonical template generator
        uses: actions/checkout@v4
        with:
          repository: openeggbert/cna-ts-template
          ref: 2ea39870941d0520c7599afd9455efda9cea4c6b
          path: cna-ts-template
      - name: Install template tooling against the exact package
        run: >-
          npm install --prefix cna-ts-template --ignore-scripts --no-save --no-audit --no-fund
          "$GITHUB_WORKSPACE/artifacts/cna-ts-0.1.0.tgz" typescript@5.9.2 vite@8.2.2
      - name: Generated TypeScript and JavaScript consumers
        run: >-
          node cna-ts-template/tools/verify-generated.mjs
          --package "$GITHUB_WORKSPACE/artifacts/cna-ts-0.1.0.tgz"
      - name: Optional evidence status
        env:
          XNA_REFERENCE_PATH: ${{ vars.XNA_REFERENCE_PATH }}
          CNA_LIBRARY_PATH: ${{ vars.CNA_LIBRARY_PATH }}
          CNA_SOURCE_PATH: ${{ vars.CNA_SOURCE_PATH }}
          CNA_WASM_ARTIFACT_DIR: ${{ vars.CNA_WASM_ARTIFACT_DIR }}
          CNA_STRONG_WASM_ARTIFACT_DIR: ${{ vars.CNA_STRONG_WASM_ARTIFACT_DIR }}
          CNA_WINDOWED_LIBRARY_PATH: ${{ vars.CNA_WINDOWED_LIBRARY_PATH }}
        run: |
          test -n "$XNA_REFERENCE_PATH" && echo STRICT_API_ARTIFACT=CONFIGURED || echo STRICT_API_ARTIFACT=NOT_CONFIGURED
          test -n "$CNA_LIBRARY_PATH" && test -n "$CNA_SOURCE_PATH" && echo NATIVE_ARTIFACT=CONFIGURED || echo NATIVE_ARTIFACT=NOT_CONFIGURED
          test -n "$CNA_WASM_ARTIFACT_DIR" && echo BROWSER_ARTIFACT=CONFIGURED || echo BROWSER_ARTIFACT=NOT_CONFIGURED
          test -n "$CNA_STRONG_WASM_ARTIFACT_DIR" && echo STRONG_BROWSER_ARTIFACT=CONFIGURED || echo STRONG_BROWSER_ARTIFACT=NOT_CONFIGURED
          test -n "$CNA_WINDOWED_LIBRARY_PATH" && echo WINDOWED_ARTIFACT=CONFIGURED || echo WINDOWED_ARTIFACT=NOT_CONFIGURED
      - uses: actions/upload-artifact@v4
        with:
          name: cna-ts-package
          path: artifacts/cna-ts-0.1.0.tgz
          if-no-files-found: error

  strict-api:
    if: ${{ vars.XNA_REFERENCE_PATH != '' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Strict XNA API verification and missing-family inventory
        env:
          XNA_REFERENCE_PATH: ${{ vars.XNA_REFERENCE_PATH }}
        run: |
          node tools/api-compat/verify.mjs --format json --output /tmp/api-compat-report.json
          cmp docs/api-compat-report.json /tmp/api-compat-report.json
          node tools/api-compat/missing-type-inventory.mjs --output /tmp/missing-type-inventory.md --json-output /tmp/missing-type-inventory.json
          test "$(node -p "require('/tmp/missing-type-inventory.json').missingTypeCount")" = 0
          cmp docs/missing-type-inventory.md /tmp/missing-type-inventory.md
          cmp docs/missing-type-inventory.json /tmp/missing-type-inventory.json

  native-qualification:
    if: ${{ vars.CNA_LIBRARY_PATH != '' && vars.CNA_SOURCE_PATH != '' }}
    runs-on: self-hosted
    env:
      CNA_NATIVE_LIBRARY: ${{ vars.CNA_LIBRARY_PATH }}
      CNA_SOURCE_PATH: ${{ vars.CNA_SOURCE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: The artifact answers the ABI this package targets, and exports every import
        # No pinned library hash: the artifact is built out of tree and is rebuilt whenever the
        # dependency moves, so a frozen hash would only ever mean "this runner is stale". What is
        # checked is what actually matters -- the ABI is in the targeted window, every imported
        # symbol is present, and every signature matches the headers under -Werror.
        run: node tools/audit-cna-abi.mjs
      - name: Exact native integration
        run: npm run test:native
      - name: Modern CNA extension integration
        run: npm run test:extensions
      - name: CNB compiled content, end to end
        run: npm run test:cnb
      - name: The suites that need a native library and were never run here
        # Seven suites that pass locally and that this workflow did not invoke, so a regression in
        # any of them shipped green. They need exactly what this job already has.
        run: |
          npm run test:model-part
          npm run test:content-survey
          npm run test:input-devices
          npm run test:media-library
          npm run test:avatars
          npm run test:sprite-font-oracle
      - name: The content pipeline, required to execute
        # `test:content` skips all ten of its tests without a native library and still exits zero,
        # which is a green tick for a suite that ran nothing. This job HAS the library, so it runs
        # the required variant: a skip here is a failure by name.
        run: npm run test:content:required
      - name: Windowed renderer with real GPU pixels
        # Guarded on the variable rather than left to skip internally. Where a windowed library is
        # configured this runs the REQUIRED variant, which fails by name if the library or the
        # display turns out to be missing and prints WINDOWED_TESTS_EXECUTED; where it is not
        # configured the step does not run at all, which the run reports as a skipped step rather
        # than as a passing suite that tested nothing.
        if: ${{ vars.CNA_WINDOWED_LIBRARY_PATH != '' }}
        env:
          CNA_WINDOWED_LIBRARY: ${{ vars.CNA_WINDOWED_LIBRARY_PATH }}
        run: xvfb-run -a npm run test:windowed:required
      - name: Compiled effects, from reflection through to pixels
        if: ${{ vars.CNA_WINDOWED_LIBRARY_PATH != '' }}
        env:
          CNA_WINDOWED_LIBRARY: ${{ vars.CNA_WINDOWED_LIBRARY_PATH }}
        run: xvfb-run -a npm run test:effect-reflection:required

  browser-qualification:
    if: ${{ vars.CNA_WASM_ARTIFACT_DIR != '' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: 60 and 600 real browser frames on a WebGL2 context
        env:
          CNA_WASM_ARTIFACT_DIR: ${{ vars.CNA_WASM_ARTIFACT_DIR }}
          CNA_PLAYWRIGHT_MODULE: ${{ vars.CNA_PLAYWRIGHT_MODULE }}
        run: npm run test:wasm-browser
      - name: The same module, driven by real browser input
        env:
          CNA_WASM_ARTIFACT_DIR: ${{ vars.CNA_WASM_ARTIFACT_DIR }}
          CNA_PLAYWRIGHT_MODULE: ${{ vars.CNA_PLAYWRIGHT_MODULE }}
        run: npm run test:wasm-browser-input

      # A separate variable from CNA_WASM_ARTIFACT_DIR, and deliberately so: the artifact above is
      # the one a consumer gets by default, and it carries neither optional CNA runtime. The
      # compiled-effect and CNAEXT claims need an artifact built with
      # -DCNA_EASYGL_COMPILED_EFFECTS=ON -DCNA_CNAEXT=ON, and the required form below fails rather
      # than skipping if the one it is pointed at turns out not to be -- so a runner that has only
      # the default artifact configured does not report a green compiled-effect qualification.
      - name: Compiled effects and CNAEXT, on an artifact built with both
        if: ${{ vars.CNA_STRONG_WASM_ARTIFACT_DIR != '' }}
        env:
          CNA_WASM_ARTIFACT_DIR: ${{ vars.CNA_STRONG_WASM_ARTIFACT_DIR }}
          CNA_SOURCE_PATH: ${{ vars.CNA_SOURCE_PATH }}
          CNA_PLAYWRIGHT_MODULE: ${{ vars.CNA_PLAYWRIGHT_MODULE }}
        run: npm run test:wasm-browser:strong:required
